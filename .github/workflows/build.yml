name: Build iStoreOS 25.12 with YT6801 driver

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync unzip zlib1g-dev file \
            wget cpio swig time subversion mercurial rsync
          df -h /

      - name: Clone iStoreOS 25.12
        run: |
          git clone --depth 1 -b istoreos-25.12 https://github.com/istoreos/istoreos.git openwrt
          cd openwrt
          git log -1 --oneline
          cat target/linux/generic/kernel-6.12

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply YT6801 patches
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh openwrt

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_PACKAGE_kmod-dwmac-motorcomm=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          echo "=== 关键配置确认 ==="
          grep -E "CONFIG_TARGET_x86_64_Generic|CONFIG_PACKAGE_kmod-dwmac-motorcomm|CONFIG_PACKAGE_luci=" .config || true
          if ! grep -q "^CONFIG_PACKAGE_kmod-dwmac-motorcomm=y" .config; then
            echo "::error::kmod-dwmac-motorcomm 未被选中，检查补丁是否生效"
            exit 1
          fi

      - name: Pre-check kernel patches
        run: |
          cd openwrt
          set -o pipefail
          mkdir -p /tmp/prep
          make -j1 target/linux/prepare V=s 2>&1 | tail -n 120
          echo "== 内核补丁应用完成，未发现 FAILED =="

      - name: Download package sources
        run: |
          cd openwrt
          set -o pipefail
          make -j$(nproc) download || make -j$(nproc) download

      - name: Build firmware
        run: |
          cd openwrt
          set -o pipefail
          : > build.log
          make -j$(( $(nproc) + 1 )) V=s 2>&1 | tee -a build.log | tail -n 150

      - name: Show artifacts
        if: always()
        run: |
          {
            echo "== bin/targets/x86/64 =="
            ls -lh openwrt/bin/targets/x86/64/ 2>/dev/null || echo "(目录不存在)"
            echo "== manifest 里的 motorcomm =="
            grep -i "motorcomm" openwrt/bin/targets/x86/64/*.manifest 2>/dev/null || echo "(manifest 未找到或无 motorcomm)"
          } | tee artifact-list.txt

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-25.12-yt6801
          if-no-files-found: error
          path: |
            openwrt/bin/targets/x86/64/*combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/sha256sums
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: warn
          path: |
            openwrt/build.log
            artifact-list.txt
          retention-days: 7

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          LOG=openwrt/build.log
          [ -s "$LOG" ] || LOG=artifact-list.txt
          [ -s "$LOG" ] || LOG=/dev/null
          tail -n 250 "$LOG" > /tmp/tail.txt 2>/dev/null
          python3 - "$RUN_URL" <<'PY'
          import json, os, subprocess, sys
          run_url = sys.argv[1]
          tail = open('/tmp/tail.txt', encoding='utf-8', errors='replace').read()
          if len(tail) > 60000:
              tail = tail[-60000:]
          body = ("构建失败，以下是日志末尾：\n\n运行记录：" + run_url +
                  "\n\n```\n" + tail + "\n```\n")
          payload = json.dumps({"title": "CI failure " + os.environ.get("GITHUB_RUN_ID", ""),
                                "body": body, "labels": []})
          open('/tmp/payload.json', 'w', encoding='utf-8').write(payload)
          subprocess.run(["curl", "-sS", "-X", "POST",
                          "-H", "Authorization: Bearer " + os.environ["GH_TOKEN"],
                          "-H", "Accept: application/vnd.github+json",
                          "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
                          "-d", "@/tmp/payload.json"], check=False)
          PY
