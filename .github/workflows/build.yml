name: Build iStoreOS 25.12 with YT6801 driver

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync unzip zlib1g-dev file \
            wget cpio swig time subversion mercurial rsync
          df -h /

      - name: Clone iStoreOS 25.12
        run: |
          git clone --depth 1 -b istoreos-25.12 https://github.com/istoreos/istoreos.git openwrt
          cd openwrt
          git log -1 --oneline
          cat target/linux/generic/kernel-6.12

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply YT6801 patches
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh openwrt

      - name: Configure (official full package set + YT6801)
        run: |
          cd openwrt

          # --- 内核侧保险 ---
          # i915-sriov-dkms 内置 vendor 版 DRM_GPUSVM，其 include/config.h 硬性要求内核
          # 开启 CONFIG_HMM_MIRROR + CONFIG_MMU_NOTIFIER，否则直接 #error 中断编译。
          # iStoreOS 的 x86/generic config-6.12 均未开启这两个符号，这里补上（不依赖包，纯内核配置）。
          KCFG=target/linux/x86/config-6.12
          for sym in CONFIG_HMM_MIRROR CONFIG_MMU_NOTIFIER; do
            grep -q "^${sym}=y" "$KCFG" || echo "${sym}=y" >> "$KCFG"
          done
          echo "=== 内核配置追加结果 ==="
          grep -nE '^CONFIG_(HMM_MIRROR|MMU_NOTIFIER)=y' "$KCFG"

          cp ../seed.config .config
          make defconfig

          # --- 依赖兜底 ---
          # 三个 SR-IOV 包若被别处依赖重新拉起，就在 2 分钟内失败，而不是编译 2 小时后再失败。
          for p in kmod-drm-i915-coex kmod-drm-xe-sriov kmod-intel-sriov-compat; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              sed -i "s|^CONFIG_PACKAGE_${p}=y|# CONFIG_PACKAGE_${p} is not set|" .config
              echo "::warning::强制关闭 ${p}"
            fi
          done
          make defconfig

          echo "=== SR-IOV 包状态（应全部为 is not set） ==="
          grep -E "^#? ?CONFIG_PACKAGE_kmod-(drm-i915-coex|drm-xe-sriov|intel-sriov-compat)" .config || echo "(未出现)"
          if grep -qE "^CONFIG_PACKAGE_(kmod-drm-i915-coex|kmod-drm-xe-sriov|kmod-intel-sriov-compat)=y" .config; then
            echo "::error::SR-IOV 包被依赖重新拉起，关闭失败，需要换方案"
            exit 1
          fi

          echo "=== 关键配置确认 ==="
          for s in CONFIG_PACKAGE_kmod-dwmac-motorcomm CONFIG_PACKAGE_luci-app-store \
                   CONFIG_PACKAGE_docker CONFIG_PACKAGE_luci-app-dockerman \
                   CONFIG_PACKAGE_luci CONFIG_TARGET_ROOTFS_PARTSIZE; do
            printf '%-45s %s\n' "$s" "$(grep -E "^${s}=" .config || echo '<未选中>')"
          done
          echo "=== 选中包总数 ==="
          grep -c '^CONFIG_PACKAGE_.*=y$' .config
          if ! grep -q "^CONFIG_PACKAGE_kmod-dwmac-motorcomm=y" .config; then
            echo "::error::kmod-dwmac-motorcomm 未被选中，检查补丁是否生效"
            exit 1
          fi
          if ! grep -q "^CONFIG_PACKAGE_luci-app-store=y" .config; then
            echo "::warning::luci-app-store 未选中（应用商店缺失，可继续）"
          fi

      - name: Pre-check kernel patches
        continue-on-error: true
        run: |
          cd openwrt
          : > prepare.log
          make -j1 target/linux/prepare V=s 2>&1 | tee -a prepare.log | tail -n 120
          RC=${PIPESTATUS[0]}
          echo "prepare 退出码: $RC"
          echo "== Patch failed 出现次数: $(grep -c 'Patch failed' prepare.log || true) =="
          echo "== prepared 打点: $(ls build_dir/target-x86_64_musl/linux-x86_64/linux-*/.prepared_* 2>/dev/null | wc -l) =="
          KCONF=$(ls build_dir/target-*/linux-*/linux-6.12.*/.config 2>/dev/null | head -1)
          if [ -n "$KCONF" ]; then
            echo "== 内核 .config: $KCONF"
            grep -E '^CONFIG_(HMM_MIRROR|MMU_NOTIFIER|DRM_GPUSVM)' "$KCONF" || echo "(内核配置里没有 HMM_MIRROR/MMU_NOTIFIER 相关项)"
          fi
          exit 0

      - name: Download package sources
        run: |
          cd openwrt
          set -o pipefail
          make -j$(nproc) download || make -j$(nproc) download

      - name: Build firmware
        run: |
          cd openwrt
          df -h / | tee artifact-df.txt
          set +e
          : > build.log
          make -j$(( $(nproc) + 1 )) V=s 2>&1 | tee -a build.log | tail -n 150
          RC=${PIPESTATUS[0]}
          echo "make 退出码: $RC" | tee -a build.log
          if [ "$RC" -ne 0 ]; then
            echo "=== 首轮失败，用 -k + IGNORE_ERRORS=m 续编（跳过坏包，尽量把镜像做出来） ===" | tee -a build.log
            make -k -j$(( $(nproc) + 1 )) IGNORE_ERRORS=m V=s 2>&1 | tee -a build.log | tail -n 120
            RC=${PIPESTATUS[0]}
            echo "-k 重试退出码: $RC" | tee -a build.log
            echo "=== 被跳过的包 ===" | tee -a build.log
            grep -E "ERROR: package .* failed" build.log | sort -u | tee -a build.log
          fi
          # 只要镜像做出来了就算成功（个别可选包失败不影响固件可用性）
          IMG=$(ls bin/targets/x86/64/*combined-efi.img.gz 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::make 退出码 $RC，且未产出镜像"
            exit 1
          fi
          echo "=== 镜像已产出（make 退出码 $RC）===" | tee -a build.log
          ls -lh "$IMG" | tee -a build.log
          tail -5 build.log

      - name: Show artifacts
        if: always()
        run: |
          {
            echo "== bin/targets/x86/64 =="
            ls -lh openwrt/bin/targets/x86/64/ 2>/dev/null || echo "(目录不存在)"
            echo "== manifest 里的 motorcomm =="
            grep -i "motorcomm" openwrt/bin/targets/x86/64/*.manifest 2>/dev/null || echo "(manifest 未找到或无 motorcomm)"
            echo "== manifest 里的 sriov（应为空）=="
            grep -i "sriov" openwrt/bin/targets/x86/64/*.manifest 2>/dev/null || echo "(无，符合预期)"
          } | tee artifact-list.txt

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-25.12-yt6801
          if-no-files-found: error
          path: |
            openwrt/bin/targets/x86/64/*combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/sha256sums
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: warn
          path: |
            openwrt/build.log
            openwrt/prepare.log
            artifact-list.txt
          retention-days: 7

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          LOG=""
          for f in openwrt/build.log openwrt/prepare.log artifact-list.txt; do
            if [ -s "$f" ]; then LOG="$f"; break; fi
          done
          echo "选用日志: ${LOG:-<无>}"

          # 1) 提炼首个失败点 + 所有错误行（并行编译时真错误在几千行之前）
          : > /tmp/report.txt
          if [ -n "$LOG" ]; then
            {
              echo "### 首个 *** Error 1 之前的上下文"
              FIRST=$(grep -n '\*\*\* .*Error 1$' "$LOG" | head -1 | cut -d: -f1)
              if [ -n "$FIRST" ]; then
                S=$((FIRST-70)); [ "$S" -lt 1 ] && S=1
                sed -n "${S},$((FIRST+3))p" "$LOG" | cut -c1-260
              fi
              echo ""
              echo "### 所有错误行"
              grep -nE ': error:|ERROR:|configure: error|No rule to make target|undefined reference|fatal error|Killed|No space left|cannot find -l|download failed|Hash mismatch' "$LOG" | cut -c1-260 | head -80
            } >> /tmp/report.txt
          else
            echo "(没有任何日志文件)" >> /tmp/report.txt
          fi

          # 2) 把完整日志推到 ci-log 分支，供本地 git fetch 读取（Actions 日志 API 需鉴权）
          if [ -n "$LOG" ]; then
            git checkout -q --orphan ci-log-${{ github.run_id }} 2>/dev/null || true
            git rm -rq --cached . 2>/dev/null || true
            cp "$LOG" ci-build.log
            git add -f ci-build.log
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI log run ${{ github.run_id }}"
            git push -f origin HEAD:ci-log 2>&1 | tail -3 || echo "推送 ci-log 分支失败"
          fi

          # 3) 发 Issue
          python3 - "$RUN_URL" <<'PY'
          import json, os, subprocess, sys
          run_url = sys.argv[1]
          rep = open('/tmp/report.txt', encoding='utf-8', errors='replace').read()
          if len(rep) > 55000:
              rep = rep[:55000]
          body = ("构建失败，错误摘要：\n\n运行记录：" + run_url +
                  "\n\n完整日志见仓库 `ci-log` 分支的 `ci-build.log`。\n\n```\n" + rep + "\n```\n")
          payload = json.dumps({"title": "CI failure " + os.environ.get("GITHUB_RUN_ID", ""),
                                "body": body, "labels": []})
          open('/tmp/payload.json', 'w', encoding='utf-8').write(payload)
          subprocess.run(["curl", "-sS", "-X", "POST",
                          "-H", "Authorization: Bearer " + os.environ["GH_TOKEN"],
                          "-H", "Accept: application/vnd.github+json",
                          "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
                          "-d", "@/tmp/payload.json"], check=False)
          PY
