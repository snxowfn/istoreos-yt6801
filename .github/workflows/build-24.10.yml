name: Build iStoreOS 24.10.8 with YT6801 driver (ipk)

# 24.10 路线：opkg/ipk 包管理 + 内核 6.6.144 + 官方 Lua 版 dockerman（顶级 admin/docker 菜单）。
# 25.12 是 apk 体系，第三方 ipk 装不上；这条线专门解决兼容性问题。

on:
  workflow_dispatch:
  push:
    branches: [ build-2410 ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync unzip zlib1g-dev file \
            wget cpio swig time subversion mercurial rsync help2man
          df -h /

      - name: Clone iStoreOS 24.10
        run: |
          # 本步骤的输出也落盘，失败时随 build-log artifact 上传（Actions 原始日志需鉴权）
          exec > >(tee clone.log) 2>&1
          set -euo pipefail
          for i in 1 2 3; do
            if git clone --depth 1 -b istoreos-24.10 https://github.com/istoreos/istoreos.git openwrt; then
              break
            fi
            echo "clone 第 ${i} 次失败，重试"
            rm -rf openwrt
            sleep 10
          done
          cd openwrt
          git log -1 --oneline
          echo "=== 内核版本（应为 6.6.x）==="
          cat include/kernel-6.6
          echo "=== 包管理体系确认 ==="
          # 注意：iStoreOS 24.10 分支里 package/system 同时保留了 apk 与 opkg 两个目录，
          # 不能凭 apk 目录存在就判定分支选错（首版就是被这条守卫误杀的）。
          # 真正的判据：opkg 目录必须在，且最终产物是 .ipk（构建后由 Show artifacts 复核）。
          test -d package/system/opkg && echo "OK: opkg 目录存在" || { echo "::error::缺少 package/system/opkg"; exit 1; }
          if [ -d package/system/apk ]; then
            echo "提示: 分支同时带有 apk 目录（iStoreOS 24.10 的遗留骨架），以 opkg 为准"
          fi
          grep -q '^PKG_MGR' package/Makefile 2>/dev/null || true

      - name: Update and install feeds
        run: |
          cd openwrt
          exec > >(tee -a feeds.log) 2>&1
          set -o pipefail
          # 官方 24.10.8 发布流水线额外使用的 5 个 feed，公开分支 feeds.conf.default 未声明。
          # 缺了它们，quickstart/linkease/ddnsto/diskman/oaf/mergerfs/nvtop 等约 30 个包会在
          # make defconfig 时被静默丢弃（症状：固件能启动，但首页菜单不全、NAS/Docker 体验残缺）。
          cat >> feeds.conf.default <<'FEEDS'
          # --- 官方全量包所需的额外 feed ---
          src-git linkease_nas https://github.com/linkease/nas-packages.git;master
          src-git linkease_nas_luci https://github.com/linkease/nas-packages-luci.git;main
          src-git diskman https://github.com/lisaac/luci-app-diskman.git;master
          src-git oaf https://github.com/destan19/OpenAppFilter.git;master
          src-git jjm2473_apps https://github.com/jjm2473/openwrt-apps.git;main
          FEEDS
          echo "=== feeds.conf.default ==="
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # --- Docker 菜单：24.10 的 luci feed 仍是 lisaac Lua 版（与官方 24.10.8 同源）---
          # 官方 24.10.8 里 luci-app-dockerman=0.5.13.20250109，controller 注册
          # entry({"admin","docker"}, firstchild(), _("Docker"), 40) —— 侧边栏顶级菜单。
          # 一旦 feed 漂移成 JS/ucode 版（挂 admin/services 且依赖运行态），菜单会消失，
          # 所以这里硬校验；不符合就内置 lisaac Lua 版兜底。
          DK=package/feeds/luci/luci-app-dockerman
          if [ -f "$DK/luasrc/controller/dockerman.lua" ] && \
             grep -q '"admin", "docker"' "$DK/luasrc/controller/dockerman.lua"; then
            echo "OK: luci feed 提供 Lua 版 dockerman（顶级 admin/docker 菜单）"
            grep -m1 'PKG_VERSION' "$DK/Makefile" || true
          else
            echo "::warning::luci feed 的 dockerman 不是 Lua 顶级菜单版，启用内置兜底"
            rm -rf "$DK"
            git clone --depth 1 https://github.com/lisaac/luci-app-dockerman.git /tmp/src-dockerman
            git clone --depth 1 https://github.com/lisaac/luci-lib-docker.git /tmp/src-luci-lib-docker
            mkdir -p package/dockerman-lua
            cp -r /tmp/src-dockerman/applications/luci-app-dockerman package/dockerman-lua/
            cp -r /tmp/src-luci-lib-docker/collections/luci-lib-docker package/dockerman-lua/
            rm -rf package/dockerman-lua/luci-app-dockerman/.github
            # opkg 对版本号较宽容，但带 v 前缀仍可能影响依赖比较，统一去掉
            sed -i 's/^PKG_VERSION:=v/PKG_VERSION:=/' package/dockerman-lua/luci-lib-docker/Makefile || true
            grep -q 'luci.model.docker' package/dockerman-lua/luci-app-dockerman/luasrc/controller/dockerman.lua \
              || { echo "::error::内置 dockerman 源码不正确"; exit 1; }
            echo "OK: 已启用内置 Lua 版 dockerman"
          fi
          echo "=== 确认没有 JS 版残留 ==="
          if [ -e package/feeds/luci/luci-app-dockerman ] && \
             [ ! -f package/feeds/luci/luci-app-dockerman/luasrc/controller/dockerman.lua ]; then
            echo "::error::JS 版 dockerman 仍存在，会与内置包冲突"
            exit 1
          fi

      - name: Apply YT6801 patches
        run: |
          chmod +x scripts/apply-patches-2410.sh
          ./scripts/apply-patches-2410.sh openwrt

      - name: Configure (official 24.10.8 full package set + YT6801)
        run: |
          cd openwrt
          cp ../seed-2410.config .config
          make defconfig

          echo "=== 关键配置确认 ==="
          for s in CONFIG_PACKAGE_kmod-dwmac-motorcomm CONFIG_PACKAGE_kmod-phy-motorcomm \
                   CONFIG_PACKAGE_luci-app-store CONFIG_PACKAGE_docker \
                   CONFIG_PACKAGE_luci-app-dockerman CONFIG_PACKAGE_luci-lib-docker \
                   CONFIG_PACKAGE_quickstart CONFIG_TARGET_ROOTFS_PARTSIZE; do
            printf '%-46s %s\n' "$s" "$(grep -E "^${s}=" .config || echo '<未选中>')"
          done
          echo "=== 选中包总数 ==="
          grep -c '^CONFIG_PACKAGE_.*=y$' .config
          if ! grep -q "^CONFIG_PACKAGE_kmod-dwmac-motorcomm=y" .config; then
            echo "::error::kmod-dwmac-motorcomm 未被选中，检查补丁是否生效"
            exit 1
          fi

          # --- 关键包防呆：任何一项缺失都立即失败，绝不带伤编译 3 小时 ---
          # 教训：feed 缺失时 make defconfig 会静默丢包，固件能启动但功能残缺。
          MISS=""
          for p in kmod-dwmac-motorcomm kmod-phy-motorcomm docker dockerd \
                   luci-app-dockerman luci-lib-docker luci-compat \
                   luci-app-store luci quickstart luci-app-quickstart \
                   linkease ddnsto luci-app-ddnsto luci-app-diskman \
                   luci-app-oaf mergerfs luci-app-mergerfs nvtop \
                   luci-app-fan luci-app-cpufreq luci-app-unishare webdav2; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || MISS="$MISS $p"
          done
          if [ -n "$MISS" ]; then
            echo "::error::关键包在 make defconfig 后丢失:${MISS}（多半是对应 feed 没装上）"
            exit 1
          fi
          grep -q "^CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y" .config || \
            echo "::warning::luci-i18n-dockerman-zh-cn 未选中，Docker 界面可能是英文"

      - name: Pre-check kernel patches
        continue-on-error: true
        run: |
          cd openwrt
          : > prepare.log
          make -j1 target/linux/prepare V=s 2>&1 | tee -a prepare.log | tail -n 120
          RC=${PIPESTATUS[0]}
          echo "prepare 退出码: $RC"
          echo "== Patch failed 出现次数: $(grep -c 'Patch failed' prepare.log || true) =="
          grep -nE 'Patch failed|Hunk .* FAILED' prepare.log | head -20 || true
          echo "== prepared 打点: $(ls build_dir/target-x86_64_musl/linux-x86_64/linux-*/.prepared_* 2>/dev/null | wc -l) =="
          echo "== 驱动源文件是否落地: $(ls -l build_dir/target-x86_64_musl/linux-x86_64/linux-*/drivers/net/ethernet/stmicro/stmmac/dwmac-motorcomm.c 2>/dev/null | wc -l) =="
          exit 0

      - name: Download package sources
        run: |
          cd openwrt
          set -o pipefail
          make -j$(nproc) download || make -j$(nproc) download

      - name: Build firmware
        run: |
          cd openwrt
          df -h / | tee artifact-df.txt
          set +e
          : > build.log
          make -j$(( $(nproc) + 1 )) V=s 2>&1 | tee -a build.log | tail -n 150
          RC=${PIPESTATUS[0]}
          echo "make 退出码: $RC" | tee -a build.log
          if [ "$RC" -ne 0 ]; then
            echo "=== 首轮失败，用 -k + IGNORE_ERRORS=m 续编（跳过坏包，尽量把镜像做出来） ===" | tee -a build.log
            make -k -j$(( $(nproc) + 1 )) IGNORE_ERRORS=m V=s 2>&1 | tee -a build.log | tail -n 120
            RC=${PIPESTATUS[0]}
            echo "-k 重试退出码: $RC" | tee -a build.log
            echo "=== 被跳过的包 ===" | tee -a build.log
            grep -E "ERROR: package .* failed" build.log | sort -u | tee -a build.log
          fi
          IMG=$(ls bin/targets/x86/64/*combined-efi.img.gz 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::make 退出码 $RC，且未产出镜像"
            exit 1
          fi
          echo "=== 镜像已产出（make 退出码 $RC）===" | tee -a build.log
          if [ "$RC" -ne 0 ]; then
            echo "::warning::make 退出码 $RC，镜像为 -k 容错模式产出（可能有包被跳过），必须核对 build.log 再交付"
          fi
          ls -lh "$IMG" | tee -a build.log
          tail -5 build.log

      - name: Show artifacts
        if: always()
        run: |
          {
            echo "== bin/targets/x86/64 =="
            ls -lh openwrt/bin/targets/x86/64/ 2>/dev/null || echo "(目录不存在)"
            echo "== 包体系（应为 ipk）=="
            ls openwrt/bin/targets/x86/64/packages/*.ipk 2>/dev/null | head -3 || echo "(未见 .ipk)"
            echo "   .ipk 数量: $(ls openwrt/bin/targets/x86/64/packages/*.ipk 2>/dev/null | wc -l)"
            echo "== rootfs 里的 motorcomm 驱动（必须有）=="
            ROOTFS=openwrt/build_dir/target-x86_64_musl/root-x86
            find "$ROOTFS/lib/modules" -name 'dwmac-motorcomm.ko' -o -name 'motorcomm.ko' 2>/dev/null || true
            KO=$(find "$ROOTFS/lib/modules" -name 'dwmac-motorcomm.ko' 2>/dev/null | wc -l)
            if [ "$KO" -eq 0 ]; then
              echo "::error::rootfs 中没有 dwmac-motorcomm.ko，驱动未进镜像！"
              echo "FAIL=driver" >> "$GITHUB_ENV"
            fi
            echo "== rootfs 里的关键程序（抽查）=="
            for f in usr/bin/dockerd etc/init.d/dockerd \
                     usr/lib/lua/luci/controller/quickstart.lua; do
              [ -e "$ROOTFS/$f" ] && echo "  OK  $f" || echo "  --  $f（可能路径不同，仅抽查）"
            done
            echo "== rootfs 包管理体系（应有 /usr/lib/opkg/status）=="
            [ -e "$ROOTFS/usr/lib/opkg/status" ] && echo "  OK  usr/lib/opkg/status（ipk 体系）" || echo "  --  未见 opkg status"
            echo "== rootfs 里的 Lua 版 dockerman（顶级 Docker 菜单，必须有）=="
            for f in usr/lib/lua/luci/controller/dockerman.lua \
                     usr/lib/lua/luci/model/docker.lua; do
              if [ -e "$ROOTFS/$f" ]; then echo "  OK  $f"; else
                echo "::error::rootfs 缺少 $f —— Docker 菜单将不显示，检查 dockerman 来源"
                echo "FAIL=dockerman" >> "$GITHUB_ENV"
              fi
            done
            echo "== Docker 菜单注册位置（必须是 admin/docker 顶级）=="
            DKCTL="$ROOTFS/usr/lib/lua/luci/controller/dockerman.lua"
            if [ -e "$DKCTL" ]; then
              grep -n -m3 '"admin", *"docker"' "$DKCTL" && echo "  OK: 顶级 Docker 菜单已注册" \
                || { echo "::error::dockerman.lua 未在 admin/docker 注册顶级菜单"; echo "FAIL=menu" >> "$GITHUB_ENV"; }
            fi
            echo "== 已装的 dockerman 版本（rootfs 内 opkg 记录）=="
            awk '/^Package: luci-app-dockerman$/{f=1} f&&/^Version:/{print "  "$0; exit}' \
              "$ROOTFS/usr/lib/opkg/status" 2>/dev/null || true
          } > artifact-list.txt 2>&1
          cat artifact-list.txt
          grep -q '^FAIL=' artifact-list.txt && exit 1 || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-24.10-yt6801
          if-no-files-found: error
          path: |
            openwrt/bin/targets/x86/64/*combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/sha256sums
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-2410
          if-no-files-found: warn
          path: |
            openwrt/build.log
            openwrt/prepare.log
            openwrt/feeds.log
            clone.log
            artifact-list.txt
          retention-days: 7

      - name: Report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          LOG=""
          for f in openwrt/build.log openwrt/prepare.log openwrt/feeds.log clone.log artifact-list.txt; do
            if [ -s "$f" ]; then LOG="$f"; break; fi
          done
          echo "选用日志: ${LOG:-<无>}"

          : > /tmp/report.txt
          if [ -n "$LOG" ]; then
            {
              echo "### ① 致命错误行（ERROR: package ... failed to build / failed to install）"
              grep -nE 'ERROR: (package|tools)|failed to (build|install|compile)|Collected errors|opkg_conf|Patch failed' "$LOG" | cut -c1-300 | head -50
              echo ""
              echo "### ② 所有 make *** Error 行（真实错误一般是最后几条）"
              grep -nE '\*\*\* (Error|[^ ].*Error [0-9])' "$LOG" | cut -c1-300 | tail -40
              echo ""
              echo "### ③ 内存/磁盘杀手检查"
              grep -nE 'Killed|out of memory|No space left|signal 9' "$LOG" | cut -c1-300 | head -10
              echo ""
              echo "### ④ 日志末尾 100 行"
              tail -n 100 "$LOG" | cut -c1-300
            } >> /tmp/report.txt
          else
            echo "(没有任何日志文件)" >> /tmp/report.txt
          fi

          if [ -n "$LOG" ]; then
            gzip -kf "$LOG"
            git checkout -q --orphan ci-log-push 2>/dev/null || true
            git rm -rq --cached . 2>/dev/null || true
            mv "${LOG}.gz" ci-build-2410.log.gz
            git add -f ci-build-2410.log.gz
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI log (gzip) run ${{ github.run_id }}"
            git push -f origin HEAD:ci-log-2410 2>&1 | tail -3 || echo "推送 ci-log-2410 分支失败"
          fi

          python3 - "$RUN_URL" <<'PY'
          import json, os, subprocess, sys
          run_url = sys.argv[1]
          rep = open('/tmp/report.txt', encoding='utf-8', errors='replace').read()
          if len(rep) > 58000:
              rep = rep[:58000] + "\n...(报告超长被截断，完整日志见 ci-log-2410 分支 ci-build-2410.log.gz)\n"
          body = ("24.10 构建失败，错误摘要：\n\n运行记录：" + run_url +
                  "\n\n完整日志（gzip）见仓库 `ci-log-2410` 分支的 `ci-build-2410.log.gz`。\n\n```\n" + rep + "\n```\n")
          payload = json.dumps({"title": "CI failure 24.10 " + os.environ.get("GITHUB_RUN_ID", ""),
                                "body": body, "labels": []})
          open('/tmp/payload.json', 'w', encoding='utf-8').write(payload)
          subprocess.run(["curl", "-sS", "-X", "POST",
                          "-H", "Authorization: Bearer " + os.environ["GH_TOKEN"],
                          "-H", "Accept: application/vnd.github+json",
                          "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
                          "-d", "@/tmp/payload.json"], check=False)
          PY
